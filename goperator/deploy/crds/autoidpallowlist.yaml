apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: autoidpallowlists.myceliam.io
spec:
  group: myceliam.io
  scope: Namespaced
  names:
    plural: autoidpallowlists
    singular: autoidpallowlist
    kind: AutoidpAllowlist
    listKind: AutoidpAllowlistList
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            namespaces:
              description: >-
                Namespaces allowed to use myceliam.io/autoidp=true. A single
                instance is expected, named "default" in the myceliam-system
                namespace — see deploy/rbac-allowlist-example.yaml for how to
                restrict who can write it. Absent entirely, every namespace is
                allowed (zero-config default); once present, only namespaces
                listed here are provisioned. Never blocks cleanup/deletion of
                what's already provisioned, only new provisioning.
              type: array
              items:
                type: string
          required: ["namespaces"]
      additionalPrinterColumns:
        - name: Namespaces
          type: string
          jsonPath: .namespaces
