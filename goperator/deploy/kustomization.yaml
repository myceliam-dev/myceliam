apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - crds/awsaccessprofile.yaml
  - crds/gcpaccessprofile.yaml
  - crds/autoidpallowlist.yaml
  - deployment.yaml
  - rbac.yaml
  # rbac-allowlist-example.yaml is deliberately NOT included here — it names
