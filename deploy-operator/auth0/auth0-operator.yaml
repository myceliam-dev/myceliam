---
# internal/oidc/auth0.Provider.GetOperatorToken is now implemented: the
# operator can use Auth0 for BOTH its Management API access (creating
# workload Applications/Resource-Servers/Client-Grants/Actions — see
# auth0-client-secret.yaml / auth0-tls-secret.yaml) AND its own AWS/GCP
# cloud-federation identity, the same way Keycloak's operator client can
# serve both roles (see keycloak/keycloak-operator.yaml). These are still two
# logically separate things even though they share one credential:
#   - Management API access uses Auth0's reserved, built-in audience
#     "https://{domain}/api/v2/" — nothing to configure beyond
#     MYCELIAM_AUTH0_DOMAIN/MYCELIAM_AUTH0_OPERATOR_CLIENT_ID above.
#   - The operator's own AWS/GCP federation token uses a SEPARATE audience,
#     MYCELIAM_AUTH0_OPERATOR_AUDIENCE below — a Resource Server the operator
#     provisions itself on first use (Provider.ensureOperatorAccessScope),
#     the same way EnsureAccessScope provisions one per workload namespace.
#     There's nothing to pre-create in the Auth0 dashboard for this: just
#     pick a unique identifier string and put it in both
#     MYCELIAM_AUTH0_OPERATOR_AUDIENCE here and whatever ClientIDList/
#     allowedAudiences entry the pre-existing AWS IAM OIDC IdP / GCP
#     Workload Identity Pool provider expects (same requirement
#     MYCELIAM_KEYCLOAK_OPERATOR_SCOPE and MYCELIAM_OPERATOR_SPIFFE_AUDIENCE
#     already have for their own paths).
#
# MYCELIAM_OPERATOR_PROVIDER is left unset below: with Auth0 as the only
# active workload provider (MYCELIAM_AUTH0_DOMAIN +
# MYCELIAM_AUTH0_OPERATOR_CLIENT_ID set, nothing else), it auto-resolves to
# "auth0" — see internal/operatoridentity/operatoridentity.go's
# getOperatorToken — which resolves to Auth0Provider.GetOperatorToken.
# If you'd rather keep the operator's own cloud-federation identity on SPIRE
# instead (e.g. it's already set up from a Keycloak deployment on this
# cluster), see the commented-out SPIFFE block at the bottom of this file and
# ../spiffe/spiffe-operator.yaml for the equivalent Keycloak-workload pattern.
#
# Both AWS and GCP confirmed working live against the exact
# credential/audience this Deployment uses (STS/AssumeRoleWithWebIdentity and
# STS-token-exchange-then-impersonate respectively, both returning real
# credentials). MYCELIAM_AWS_OPERATOR_ROLE_NAME isn't set below because the
# default ("myceliam-operator", see config.go) already matches the real role
# tested against — set it explicitly if your role has a different name.
#
# IMPORTANT — AWS-side gotcha specific to the operator's own bootstrap IdP:
# unlike the *workload* AWS IdP registration path (see
# internal/cloudproviders/aws's package doc comment — EnsureIdp already
# handles this automatically), the operator's own bootstrap AWS IAM OIDC
# provider is admin-provisioned and myceliam never touches it. Confirmed
# empirically: AWS's AssumeRoleWithWebIdentity validates ClientIDList against
# the token's `azp` claim, NOT its `aud` claim, whenever azp is present —
# Auth0 (and Keycloak) tokens always carry azp, set to the raw client_id.
# ClientIDList only needs the raw client_id (e.g. "KPT1QUa3GPryMTPWvKNMKMECH0cxS4z0")
# — the literal audience string requested (e.g. MYCELIAM_AUTH0_OPERATOR_AUDIENCE's
# value, or "sts.amazonaws.com") does NOT need to be in ClientIDList at all,
# and its presence changes nothing. Put the raw client_id in both
# --client-id-list and the role's trust-policy Condition. A second,
# unrelated, also-required quirk found alongside it: the IdP's Url must be
# registered WITH a trailing slash (https://{domain}/, matching Auth0's own
# `iss` claim exactly) — AWS does not normalize this itself, and without it
# validation fails the same generic InvalidIdentityToken way even with
# ClientIDList otherwise correct.
#
# SECURITY NOTE — a direct consequence of AWS keying off azp rather than aud,
# combined with using one Auth0 Application for both roles (see this file's
# opening comment): because azp is the SAME for every token this client
# mints regardless of which audience was actually requested, its Management
# API token (a highly privileged Auth0 tenant-administration credential) is
# JUST AS VALID for AssumeRoleWithWebIdentity as its intended cloud-federation
# token — AWS cannot tell them apart. The Management API credential and the
# AWS-federation credential are therefore not independently revocable:
# compromising one structurally compromises both. This is an accepted
# tradeoff here, not an oversight — only the operator pod ever holds this
# credential (gated by the myceliam-auth0-keypair/-secret k8s Secret + RBAC
# already), and compromising it already means full Auth0 tenant admin
# access regardless of AWS, so the added blast radius is bounded rather than
# a new attack surface from zero — matching Keycloak's own precedent
# (KeycloakClientID/KeycloakOperatorScope already share one client the same
# way). Note that today's Provider always builds both p.auth (Management
# API) and p.operatorAuth (cloud-federation) from the same
# MYCELIAM_AUTH0_OPERATOR_CLIENT_ID/credential (see New() in client.go) —
# independent revocability would need a code change (a second client
# id/credential setting), not just a different env var value here.
#
# The Management API scopes myceliam-operator's Auth0 Application needs for
# this to actually work aren't just create:* (create:clients,
# create:resource_servers, create:client_grants, create:actions,
# create:client_credentials, ...) — every EnsureX helper in
# internal/oidc/auth0 does a find-before-create (GET before POST), so
# read:clients, read:resource_servers, read:client_grants, and read:actions
# are required too, plus update:clients (client_metadata bookkeeping),
# update:actions (keeping the deployed Action's code current — see
# actions.go's ensureActionCodeCurrent), and delete:clients/
# delete:resource_servers/delete:client_grants/delete:actions for teardown
# paths. Grant these on the Auth0 Management API's own Machine to Machine
# Applications tab for this client — NOT on any Custom API you've created:
# a Custom API's scopes are a completely separate, unrelated namespace that
# the Management API never reads from.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myceliam-operator
  namespace: myceliam-system
spec:
  replicas: 1
  # The operator runs with no leader election (single-instance, matching
  # kopf's --standalone mode) — Kubernetes' default RollingUpdate strategy
  # briefly runs the old and new pod together on every redeploy, and two
  # uncoordinated operator processes reconciling the same objects at once
  # can race (confirmed live: produced two duplicate Auth0 Applications for
  # the same ServiceAccount). Recreate guarantees the old pod fully stops
  # before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: myceliam-operator
  template:
    metadata:
      labels:
        app: myceliam-operator
    spec:
      serviceAccountName: myceliam-operator
      containers:
        - name: operator
          image: myceliam-operator:test
          imagePullPolicy: IfNotPresent
          env:
            - name: MYCELIAM_CLUSTER_ID
              value: "demo"
            # The pre-existing Auth0 tenant's domain — the tenant itself, and
            # the tenant-wide Action projecting
            # cloudmodels.Auth0ServiceAccountClaim into issued tokens, are
            # both admin-provisioned prerequisites the operator never creates
            # (the Action IS auto-provisioned by EnsureTenant on first use,
            # but the tenant itself, and the operator's own Application
            # below, are not) — see internal/oidc/auth0's package doc comment.
            - name: MYCELIAM_AUTH0_DOMAIN
              value: "dev-ngyf2gzgiq5odql1.us.auth0.com"
            # Identifies the operator's own Auth0 Application (Machine to
            # Machine) — not a secret, just an identifier, same reasoning as
            # MYCELIAM_KEYCLOAK_CLIENT_ID. This ONE Application is used both
            # for Management API access and (via a separate audience, below)
            # the operator's own AWS/GCP federation token. The actual
            # credential is never an env var: see auth0-client-secret.yaml /
            # auth0-tls-secret.yaml.
            - name: MYCELIAM_AUTH0_OPERATOR_CLIENT_ID
              value: "KPT1QUa3GPryMTPWvKNMKMECH0cxS4z0"
            # Required here: this deployment uses auth0-tls-secret.yaml
            # (private_key_jwt), and Auth0 assigns its own kid to that
            # credential (shown in the Auth0 dashboard), which the operator
            # has no way to derive or look up itself.
            - name: MYCELIAM_AUTH0_OPERATOR_KEYPAIR_KID
              value: "AqKELXuRmnBZ6wlQBTvLRHg3VBomWZcUojXt4TiYTNQ"
            #
            # The Resource Server identifier the operator requests for its
            # OWN AWS/GCP cloud-federation token (see this file's header
            # comment) — must match whatever ClientIDList/allowedAudiences
            # entry the pre-existing AWS IAM OIDC IdP / GCP Workload Identity
            # Pool provider expects. The operator provisions the matching
            # Resource Server + its own Client Grant automatically on first
            # use — nothing to pre-create in the Auth0 dashboard. This is the
            # "master" Custom API identifier confirmed working for GCP.
            - name: MYCELIAM_AUTH0_OPERATOR_AUDIENCE
              value: "myceliam-operator"
            - name: MYCELIAM_GCP_OPERATOR_STS_AUDIENCE
              value: "//iam.googleapis.com/projects/315798566630/locations/global/workloadIdentityPools/myceliam-operator-admin/providers/myceliam-operator-auth0"
            - name: MYCELIAM_GCP_OPERATOR_SERVICE_ACCOUNT_EMAIL
              value: "operator@project-2f046078-45a1-49af-ac9.iam.gserviceaccount.com"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          # --- SPIFFE alternative (see this file's header comment) ---
          # Uncomment this volumeMounts block, delete
          # MYCELIAM_AUTH0_OPERATOR_AUDIENCE above, and add these env vars
          # instead to keep the operator's own cloud-federation identity on
          # SPIRE rather than Auth0:
          #   - name: MYCELIAM_OPERATOR_PROVIDER
          #     value: "spiffe"
          #   - name: MYCELIAM_OPERATOR_SPIFFE_AUDIENCE
          #     value: <>
          #   - name: SPIFFE_ENDPOINT_SOCKET
          #     value: "unix:///spiffe-workload-api/spire-agent.sock"
          # volumeMounts:
          #   - name: spiffe-workload-api
          #     mountPath: /spiffe-workload-api
          #     readOnly: true
      # volumes:
      #   - name: spiffe-workload-api
      #     csi:
      #       driver: csi.spiffe.io
      #       readOnly: true
