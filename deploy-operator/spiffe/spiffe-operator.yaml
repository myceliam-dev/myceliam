---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myceliam-operator
  namespace: myceliam-system
spec:
  replicas: 1
  # The operator runs with no leader election (single-instance, matching
  # kopf's --standalone mode) — Kubernetes' default RollingUpdate strategy
  # briefly runs the old and new pod together on every redeploy, and two
  # uncoordinated operator processes reconciling the same objects at once
  # can race (confirmed live: produced two duplicate Auth0 Applications for
  # the same ServiceAccount). Recreate guarantees the old pod fully stops
  # before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: myceliam-operator
  template:
    metadata:
      labels:
        app: myceliam-operator
    spec:
      serviceAccountName: myceliam-operator
      containers:
        - name: operator
          image: myceliam-operator:test
          imagePullPolicy: IfNotPresent
          env:
            - name: MYCELIAM_CLUSTER_ID
              value: <>
            # Still required: setting MYCELIAM_KEYCLOAK_URL makes Keycloak an
            # active workload provider, so the operator can still use it for
            # the Admin REST API (provisioning any clienttype=secret/signedjwt
            # workload ServiceAccounts) — apply keycloak-client-secret.yaml or
            # keycloak-tls-secret.yaml from ../keycloak/ for this same client
            # regardless. Only the operator's OWN AWS/GCP federation token
            # (below) comes from SPIRE instead.
            - name: MYCELIAM_KEYCLOAK_URL
              value: <>
            - name: MYCELIAM_KEYCLOAK_ADMIN_REALM
              value: "master"
            - name: MYCELIAM_KEYCLOAK_CLIENT_ID
              value: "myceliam-operator-tls"
            - name: MYCELIAM_KEYCLOAK_OPERATOR_SCOPE
              value: <>
            # Independent of which workload provider(s) are active above —
            # this only picks where the operator's OWN cloud-federation token
            # comes from. Requires a SPIRE registration entry for the
            # operator's own pod (see operator-clusterspiffeid.yaml) and a
            # separate, pre-existing AWS/GCP bootstrap trust for this specific
            # SPIFFE identity — distinct from whatever trust already exists
            # for individual namespace/SA federation, and from the
            # Keycloak-based bootstrap trust keycloak-operator.yaml would use
            # instead.
            - name: MYCELIAM_OPERATOR_PROVIDER
              value: "spiffe"
            - name: MYCELIAM_OPERATOR_SPIFFE_AUDIENCE
              value: <>
            - name: SPIFFE_ENDPOINT_SOCKET
              value: "unix:///spiffe-workload-api/spire-agent.sock"
            - name: MYCELIAM_GCP_OPERATOR_STS_AUDIENCE
              value: "//iam.googleapis.com/projects/<>/locations/global/workloadIdentityPools/<>/providers/<>"
            - name: MYCELIAM_GCP_OPERATOR_SERVICE_ACCOUNT_EMAIL
              value: <>
            # Distinct from the default "myceliam-operator" role name the
            # Keycloak-bootstrapped identity uses — the SPIRE-issued identity
            # needs its own AWS role (with its own trust policy dedicated to
            # this SPIFFE identity, not shared with the Keycloak one).
            - name: MYCELIAM_AWS_OPERATOR_ROLE_NAME
              value: <>
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
