# The alternative to oidc-client-secret.yaml — apply exactly one. Requires
# the admin to have already uploaded this exact certificate to the
# myceliam-operator client's Credentials tab in the Keycloak console
# ("Signed Jwt" authenticator, single certificate — not a JWKS URL). No
# `kid` needed: Keycloak's single-certificate mode does its own key lookup
# with nothing to disambiguate.
apiVersion: v1
stringData:
  tls.crt: <>
  tls.key: <>
kind: Secret
metadata:
  name: myceliam-keycloak-keypair
  namespace: myceliam-system
type: kubernetes.io/tls
