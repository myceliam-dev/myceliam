# One of two options for the operator's own Keycloak credential — see
# oidc-tls-secret.yaml for the alternative (signed-JWT keypair). Apply
# exactly one; if both exist, the operator prefers the keypair.
apiVersion: v1
stringData:
  client-secret: <>
kind: Secret
metadata:
  name: myceliam-keycloak-secret
  namespace: myceliam-system
type: Opaque