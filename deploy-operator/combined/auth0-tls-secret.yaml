# The alternative to auth0-client-secret.yaml — apply exactly one. Requires
# the admin to have already registered this exact public key/certificate as
# a "Private Key JWT" credential on the operator's Auth0 Application (the
# same Machine to Machine Application authorized for the Management API).
#
# Unlike Keycloak's single-certificate client-jwt mode, Auth0 assigns its
# OWN kid to this credential (per the JWK Thumbprint standard, RFC 7638) —
# there's no way for the operator to derive or look it up itself before it
# can authenticate at all, so it must be supplied here: copy the kid shown
# in the Auth0 dashboard for this credential into
# MYCELIAM_AUTH0_OPERATOR_KEYPAIR_KID on the Deployment (auth0-operator.yaml).
apiVersion: v1
stringData:
  tls.crt: <>
  tls.key: <>
kind: Secret
metadata:
  name: myceliam-auth0-keypair
  namespace: myceliam-system
type: kubernetes.io/tls
