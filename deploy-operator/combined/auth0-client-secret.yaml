# One of two options for the operator's own Auth0 Management API credential
# — see auth0-tls-secret.yaml for the alternative (signed-JWT keypair).
# Apply exactly one; if both exist, the operator prefers the keypair.
#
# This must be an Auth0 Application (Machine to Machine) authorized for the
# Auth0 Management API — create one in the Auth0 dashboard, or via the
# Management API, before applying this.
apiVersion: v1
stringData:
  client-secret: <>
kind: Secret
metadata:
  name: myceliam-auth0-secret
  namespace: myceliam-system
type: Opaque
