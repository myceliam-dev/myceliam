apiVersion: batch/v1
kind: Job
metadata:
  name: example-oidc-client-portobello-signedjwt
  namespace: portobello
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: portobello-jwt
      restartPolicy: Never
      containers:
        - name: example-oidc-client
          image: example-oidc-client:test
          imagePullPolicy: Never
          env:
            # A signedjwt client's credentials secret carries only
            # tls.crt/tls.key (see reconcile.go's reconcileClient) — client_id
            # (and, for Auth0, kid) live in the companion metadata secret
            # instead. For Keycloak client_id happens to just be this
            # ServiceAccount's own name (spec.ClientName), but reading it from
            # the metadata secret establishes the same pattern Auth0's
            # signedjwt job needs, where it can't be hardcoded/assumed.
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: portobello-jwt-jwt-keycloak-metadata
                  key: client_id
            # {MYCELIAM_KEYCLOAK_URL}/realms/{ClusterID}-{namespace} — same
            # construction as IssuerURL, just not readable from a secret key
            # here, so it's spelled out directly.
            - name: KEYCLOAK_ISSUER
              value: "https://keycloak.example.com/auth/realms/demo-portobello"
            - name: KEYCLOAK_TLS_CERT_PATH
              value: "/creds/tls.crt"
            - name: KEYCLOAK_TLS_KEY_PATH
              value: "/creds/tls.key"
            # Same WLI provider as job-client-secret.yaml's gosa-secret — clienttype=secret
            # and clienttype=signedjwt both fall under GCP's KindOIDC, one
            # shared provider per namespace regardless of which SA is asking.
            - name: GCP_STS_AUDIENCE
              value: "//iam.googleapis.com/projects/<gcp-project-number>/locations/global/workloadIdentityPools/myceliam-operator/providers/demo-portobello-keycloak"
          volumeMounts:
            - name: creds
              mountPath: /creds
              readOnly: true
      volumes:
        - name: creds
          secret:
            secretName: portobello-jwt-jwt-keycloak-credentials
