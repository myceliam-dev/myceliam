apiVersion: batch/v1
kind: Job
metadata:
  name: example-oidc-client
  namespace: demo-ns1
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: gosa-secret
      restartPolicy: Never
      containers:
        - name: example-oidc-client
          image: example-oidc-client:test
          imagePullPolicy: Never
          env:
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gosa-secret-oidc-credentials
                  key: client_id
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gosa-secret-oidc-credentials
                  key: client_secret
            - name: KEYCLOAK_ISSUER
              valueFrom:
                secretKeyRef:
                  name: gosa-secret-oidc-credentials
                  key: issuer
            # Cluster-prefixed GCP WLI provider name (see goperator's
            # config.Settings.ClusterID) — replace <gcp-project-number> with
            # your own project's number and "minikube-dev" with your own
            # MYCELIAM_CLUSTER_ID.
            - name: GCP_STS_AUDIENCE
              value: "//iam.googleapis.com/projects/<gcp-project-number>/locations/global/workloadIdentityPools/myceliam-operator/providers/minikube-dev-demo-ns1-oidc"
