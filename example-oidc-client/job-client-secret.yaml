apiVersion: batch/v1
kind: Job
metadata:
  name: demo-listbuckets-portobello
  namespace: portobello
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: portobello-secret
      restartPolicy: Never
      containers:
        - name: demo-listbuckets-oidc
          image: example-oidc-client:test 
          imagePullPolicy: Never
          env:
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: kc-secret-secret-keycloak-credentials
                  key: client_id
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kc-secret-secret-keycloak-credentials
                  key: client_secret
            - name: KEYCLOAK_ISSUER
              valueFrom:
                secretKeyRef:
                  name: kc-secret-secret-keycloak-credentials
                  key: issuer
            # Same external GCP project/pool as the local cluster, just a
            # different cluster-prefixed provider name — see job.yaml's
            # comment for why this can't be hardcoded into the binary.
            - name: GCP_STS_AUDIENCE
              value: "//iam.googleapis.com/projects/315798566630/locations/global/workloadIdentityPools/myceliam-operator/providers/demo-portobello-keycloak"