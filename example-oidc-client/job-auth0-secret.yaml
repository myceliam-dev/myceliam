apiVersion: batch/v1
kind: Job
metadata:
  name: example-oidc-client-auth0-secret
  namespace: demo-auth0
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: gosa-auth0-secret
      restartPolicy: Never
      containers:
        - name: example-oidc-client
          image: example-oidc-client:test
          imagePullPolicy: Never
          env:
            # The tenant domain, not secret material — same reasoning as
            # MYCELIAM_AUTH0_DOMAIN on the operator itself.
            - name: AUTH0_DOMAIN
              value: "dev-ngyf2gzgiq5odql1.us.auth0.com"
            - name: AUTH0_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gosa-auth0-secret-secret-auth0-credentials
                  key: client_id
            - name: AUTH0_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gosa-auth0-secret-secret-auth0-credentials
                  key: client_secret
            # cloudmodels.ParseCloudFederationSpecs's "<cloud>-<cluster-id>-
            # <namespace>" convention — shared by every SA in this namespace
            # (usesSharedAudience), unlike Keycloak's per-SA scope names.
            - name: AWS_AUTH0_AUDIENCE
              value: "aws-demo-demo-auth0"
            - name: GCP_AUTH0_AUDIENCE
              value: "gcp-demo-demo-auth0"
            # Cluster-prefixed, per-workload-provider GCP WLI provider name
            # ("<cluster>-<namespace>-<workloadProvider>" — see gcp.go's
            # providerID doc comment); replace <gcp-project-number> with your
            # own project's number once this namespace's WLI provider has
            # actually been registered by the operator. The repeated
            # "auth0-auth0" here isn't a typo — this namespace is itself
            # named "demo-auth0", and the trailing "-auth0" is the workload
            # provider suffix.
            - name: GCP_STS_AUDIENCE
              value: "//iam.googleapis.com/projects/<gcp-project-number>/locations/global/workloadIdentityPools/myceliam-operator/providers/demo-demo-auth0-auth0"
